<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mybio.lat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .background-gif {
            background-image: url('https://i.pinimg.com/originals/12/eb/55/12eb5546de3d7124df0fb9362af2587c.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .black-overlay {
            background: rgba(0, 0, 0, 0.5);
        }
        
        .card {
            background: rgba(0, 0, 0, 0.78);
            border: 6px solid #000000;
            box-shadow: 0 0 80px -15px rgba(0, 0, 0, 0.9);
            width: 90%;
            max-width: 900px; /* caja más ancha */
        }
        
        .play-button {
            font-size: 5.5rem;
            transition: all 0.4s ease;
        }
        
        .play-button:hover {
            transform: scale(1.15);
            color: #fff;
        }
    </style>
</head>
<body class="background-gif min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Black overlay / Intro -->
    <div id="intro" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/70 cursor-pointer transition-all duration-700">
        <div class="text-center">
            <div id="play-btn" 
                 class="play-button text-white/90 text-[120px] md:text-[160px] font-light mb-6">
                ▶
            </div>
            <p class="text-white text-2xl md:text-3xl tracking-[4px] font-light">CLICK TO PLAY</p>
            <p class="text-white/60 text-sm mt-8">Luis Angel</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-card" class="card relative z-20 rounded-3xl p-12 text-white hidden flex-col items-center">
        
        <!-- Title -->
        <h1 class="text-4xl font-semibold mt-6 tracking-tight">Luis Angel</h1>

        <!-- Description -->
        <p class="text-center text-white/75 mt-5 text-[17px] leading-relaxed max-w-2xl">
            Artist • Producer • Creating vibes from Hermosillo
        </p>

        <div class="text-white/30 text-xs mt-12 tracking-widest">
            mybio.lat
        </div>
    </div>

    <!-- Video/Audio Player -->
    <video id="music" loop class="hidden">
        <source src="https://github.com/user-attachments/assets/904c5549-ea33-493e-a168-53aa1f509c37j" type="video/mp4">
    </video>

    <script>
        window.onload = function() {
            const intro = document.getElementById('intro');
            const card = document.getElementById('main-card');
            const video = document.getElementById('music');

            function startExperience() {
                // Fade out del overlay
                intro.style.transition = 'opacity 0.8s ease';
                intro.style.opacity = '0';

                setTimeout(() => {
                    intro.style.display = 'none';
                    
                    // Mostrar main-card
                    card.classList.remove('hidden');
                    card.classList.add('flex');
                    
                    // Reproducir video/audio
                    video.play().catch(e => console.log("Playback started after interaction"));
                }, 800); // coincide con fade
            }

            // Click anywhere para iniciar, solo una vez
            document.body.addEventListener('click', startExperience, { once: true });
        };
    </script>
</body>
</html>
