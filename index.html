<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mybio.lat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;

        <!-- Description -->
        <p class="text-center text-white/75 mt-5 text-[17px] leading-relaxed max-w-2xl">
            Artist • Producer • Creating vibes from Hermosillo
        </p>

        <div class="text-white/30 text-xs mt-12 tracking-widest">
            mybio.lat
        </div>
    </div>

    <!-- Video/Audio Player -->
    <video id="music" loop class="hidden">
        <source src="https://github.com/user-attachments/assets/904c5549-ea33-493e-a168-53aa1f509c37j" type="video/mp4">
    </video>

    <script>
        window.onload = function() {
            const intro = document.getElementById('intro');
            const card = document.getElementById('main-card');
            const video = document.getElementById('music');

            function startExperience() {
                // Fade out del overlay
                intro.style.transition = 'opacity 0.8s ease';
                intro.style.opacity = '0';

                setTimeout(() => {
                    intro.style.display = 'none';
                    
                    // Mostrar main-card
                    card.classList.remove('hidden');
                    card.classList.add('flex');
                    
                    // Reproducir video/audio
                    video.play().catch(e => console.log("Playback started after interaction"));
                }, 800); // coincide con fade
            }

            // Click anywhere para iniciar, solo una vez
            document.body.addEventListener('click', startExperience, { once: true });
        };
    </script>
</body>
</html>
