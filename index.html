<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mybio.lat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .background-gif {
            background-image: url('https://i.pinimg.com/originals/12/eb/55/12eb5546de3d7124df0fb9362af2587c.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .black-overlay {
            background: rgba(0, 0, 0, 0.45);
        }
        
        .card {
            background: rgba(0, 0, 0, 0.75);
            border: 5px solid #000000;
            box-shadow: 0 0 70px -10px rgba(0, 0, 0, 0.8);
            width: 520px;
            max-width: 92vw;
        }
        
        .pfp-container {
            box-shadow: 0 0 35px -5px rgba(255, 255, 255, 0.25);
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body class="background-gif min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Black overlay -->
    <div class="black-overlay fixed inset-0 z-10"></div>

    <!-- Click to continue -->
    <div id="intro" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 cursor-pointer transition-opacity duration-700">
        <div class="text-center">
            <h1 class="text-white text-5xl md:text-6xl font-semibold tracking-widest">CLICK ANYWHERE</h1>
            <p class="text-white/70 text-2xl mt-4 tracking-wider">TO CONTINUE</p>
        </div>
    </div>

    <!-- Main Card - Wider than tall -->
    <div id="main-card" class="card relative z-20 rounded-3xl p-10 text-white hidden flex-col items-center">
        
        <!-- PFP -->
        <div class="pfp-container w-48 h-48 rounded-full overflow-hidden border-4 border-black bg-black">
            <canvas id="canvas" width="192" height="192"></canvas>
        </div>

        <!-- Title -->
        <h1 class="text-4xl font-semibold mt-8 tracking-tight text-center">Luis Angel</h1>

        <!-- Description only -->
        <p id="desc" class="text-center text-white/80 mt-4 text-lg leading-relaxed max-w-xs">
            <!-- Aquí puedes cambiar tu descripción -->
            Artist • Producer • Creating vibes from Hermosillo
        </p>

        <div class="text-white/30 text-xs mt-12">
            mybio.lat
        </div>
    </div>

    <!-- Music -->
    <audio id="music" loop>
        <source src="https://github.com/user-attachments/assets/904c5549-ea33-493e-a168-53aa1f509c37j" type="audio/mpeg">
    </audio>

    <script>
        // Canvas animation
        function startCanvas() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const shapes = ['circle','square','triangle','star'];
            
            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    const side = Math.floor(Math.random()*4);
                    if (side === 0) { this.x = Math.random()*192; this.y = -20; }
                    else if (side === 1) { this.x = 212; this.y = Math.random()*192; }
                    else if (side === 2) { this.x = Math.random()*192; this.y = 212; }
                    else { this.x = -20; this.y = Math.random()*192; }
                    
                    this.vx = (Math.random()-0.5)*1.2;
                    this.vy = (Math.random()-0.5)*1.2;
                    this.size = 5 + Math.random()*11;
                    this.type = shapes[Math.floor(Math.random()*4)];
                    this.rot = Math.random()*Math.PI*2;
                    this.rotSpeed = (Math.random()-0.5)*0.02;
                    this.hue = Math.random()*60 + 200;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rot += this.rotSpeed;
                    
                    // slow pull to center
                    this.vx += (96 - this.x) * 0.0015;
                    this.vy += (96 - this.y) * 0.0015;
                    
                    if (this.x < -50 || this.x > 250 || this.y < -50 || this.y > 250) this.reset();
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rot);
                    ctx.fillStyle = `hsl(${this.hue}, 90%, 85%)`;
                    
                    if (this.type === 'circle') {
                        ctx.beginPath();
                        ctx.arc(0,0,this.size,0,Math.PI*2);
                        ctx.fill();
                    } else if (this.type === 'square') {
                        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    } else if (this.type === 'triangle') {
                        ctx.beginPath();
                        ctx.moveTo(0, -this.size);
                        ctx.lineTo(-this.size*0.9, this.size*0.8);
                        ctx.lineTo(this.size*0.9, this.size*0.8);
                        ctx.fill();
                    } else if (this.type === 'star') {
                        ctx.beginPath();
                        for(let i=0; i<5; i++) {
                            ctx.lineTo(Math.cos((i*2.4-1.57))*this.size, Math.sin((i*2.4-1.57))*this.size);
                            ctx.lineTo(Math.cos((i*2.4))*this.size*0.4, Math.sin((i*2.4))*this.size*0.4);
                        }
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }
            
            function animate() {
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fillRect(0,0,192,192);
                
                // faint circle
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 12;
                ctx.beginPath();
                ctx.arc(96,96,82,0,Math.PI*2);
                ctx.stroke();
                
                particles.forEach(p => { p.update(); p.draw(); });
                
                if (particles.length < 22 && Math.random() < 0.6) particles.push(new Particle());
                
                requestAnimationFrame(animate);
            }
            
            for(let i=0; i<18; i++) particles.push(new Particle());
            animate();
        }

        // Click handler
        window.onload = function() {
            const intro = document.getElementById('intro');
            const card = document.getElementById('main-card');
            const audio = document.getElementById('music');
            
            intro.addEventListener('click', () => {
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    card.classList.remove('hidden');
                    card.classList.add('flex');
                    
                    // Play music
                    audio.play().catch(() => {});
                }, 700);
            });
            
            startCanvas();
        };
    </script>
</body>
</html>
