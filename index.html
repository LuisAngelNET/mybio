<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mybio.lat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        
        :root {
            --tw-color-primary: #ffffff;
        }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .background-gif {
            background-image: url('https://i.pinimg.com/originals/12/eb/55/12eb5546de3d7124df0fb9362af2587c.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .black-overlay {
            background: rgba(0, 0, 0, 0.35);
        }
        
        .card {
            background: rgba(0, 0, 0, 0.65);
            border: 4px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 60px -10px rgba(0, 0, 0, 0.6);
        }
        
        .pfp-container {
            box-shadow: 0 0 40px -5px rgba(255, 255, 255, 0.3);
        }
        
        .intro-screen {
            animation: fadeIn 1s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body class="background-gif min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Black transparent overlay covering the entire screen -->
    <div class="black-overlay fixed inset-0 z-10 pointer-events-none"></div>

    <!-- Click anywhere to continue screen -->
    <div id="intro-screen" 
         class="intro-screen fixed inset-0 z-50 flex items-center justify-center bg-black/70 cursor-pointer">
        <div class="text-center px-6">
            <h1 class="text-white text-5xl md:text-6xl font-semibold tracking-widest mb-6">
                CLICK ANYWHERE
            </h1>
            <p class="text-white/80 text-xl md:text-2xl font-light tracking-[3px]">
                TO CONTINUE
            </p>
            <div class="mt-12 text-white/40 text-sm flex items-center justify-center gap-2">
                <div class="w-3 h-px bg-white/40"></div>
                TAP TO START MUSIC
                <div class="w-3 h-px bg-white/40"></div>
            </div>
        </div>
    </div>

    <!-- Main content card -->
    <div class="card relative z-20 w-full max-w-md mx-4 rounded-3xl p-8 md:p-10 text-white">
        
        <!-- PFP: Black circle with slow animated shapes -->
        <div class="pfp-container mx-auto w-52 h-52 rounded-full overflow-hidden border-4 border-white/90 bg-black flex items-center justify-center">
            <canvas id="pfp-canvas" width="208" height="208" class="w-full h-full"></canvas>
        </div>

        <!-- Title -->
        <h1 class="text-center text-4xl font-semibold mt-8 tracking-tight">Luis Angel</h1>

        <!-- Description -->
        <p class="text-center text-white/80 mt-3 text-lg leading-relaxed px-4">
            Creative artist • Music producer • Dreamer
        </p>

        <!-- Links box (you can edit the links below) -->
        <div class="mt-10 space-y-3">
            <a href="#" 
               class="block bg-white/10 hover:bg-white/20 transition-all text-white text-center py-4 rounded-2xl font-medium text-lg shadow-inner">
                🎵 Listen to my music
            </a>
            <a href="#" 
               class="block bg-white/10 hover:bg-white/20 transition-all text-white text-center py-4 rounded-2xl font-medium text-lg shadow-inner">
                📸 Instagram
            </a>
            <a href="#" 
               class="block bg-white/10 hover:bg-white/20 transition-all text-white text-center py-4 rounded-2xl font-medium text-lg shadow-inner">
                🎥 YouTube
            </a>
            <a href="#" 
               class="block bg-white/10 hover:bg-white/20 transition-all text-white text-center py-4 rounded-2xl font-medium text-lg shadow-inner">
                🐦 X / Twitter
            </a>
        </div>

        <div class="text-center text-white/30 text-xs mt-8">
            mybio.lat • © Luis Angel
        </div>
    </div>

    <!-- Hidden audio player -->
    <audio id="background-music" loop>
        <source src="https://github.com/user-attachments/assets/904c5549-ea33-493e-a168-53aa1f509c37j" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        // Tailwind script already loaded
        function initTailwind() {
            // No extra config needed
        }

        // Canvas animation for PFP
        function initPFPAnimation() {
            const canvas = document.getElementById('pfp-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = 92;

            let particles = [];
            const maxParticles = 28;
            const types = ['circle', 'square', 'triangle', 'star'];

            class Particle {
                constructor() {
                    this.spawnFromEdge();
                    this.size = 6 + Math.random() * 9;
                    this.speedX = (Math.random() - 0.5) * 0.8; // very slow
                    this.speedY = (Math.random() - 0.5) * 0.8;
                    this.type = types[Math.floor(Math.random() * types.length)];
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.015;
                    this.color = `hsl(${Math.random() * 360}, 90%, 85%)`;
                }
                
                spawnFromEdge() {
                    const side = Math.floor(Math.random() * 4);
                    if (side === 0) { // top
                        this.x = Math.random() * width;
                        this.y = -10;
                    } else if (side === 1) { // right
                        this.x = width + 10;
                        this.y = Math.random() * height;
                    } else if (side === 2) { // bottom
                        this.x = Math.random() * width;
                        this.y = height + 10;
                    } else { // left
                        this.x = -10;
                        this.y = Math.random() * height;
                    }
                }
                
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.rotation += this.rotationSpeed;
                    
                    // Gentle inward drift
                    const dx = centerX - this.x;
                    const dy = centerY - this.y;
                    this.speedX += dx * 0.0008;
                    this.speedY += dy * 0.0008;
                    
                    // Limit speed
                    const speed = Math.hypot(this.speedX, this.speedY);
                    if (speed > 1.2) {
                        this.speedX *= 0.95;
                        this.speedY *= 0.95;
                    }
                    
                    // Respawn if completely off screen
                    if (this.x < -50 || this.x > width + 50 || 
                        this.y < -50 || this.y > height + 50) {
                        this.spawnFromEdge();
                    }
                }
                
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = this.color;
                    
                    if (this.type === 'circle') {
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                        ctx.fill();
                    } 
                    else if (this.type === 'square') {
                        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                    } 
                    else if (this.type === 'triangle') {
                        ctx.beginPath();
                        ctx.moveTo(0, -this.size);
                        ctx.lineTo(-this.size * 0.85, this.size * 0.85);
                        ctx.lineTo(this.size * 0.85, this.size * 0.85);
                        ctx.closePath();
                        ctx.fill();
                    } 
                    else if (this.type === 'star') {
                        ctx.beginPath();
                        const spikes = 5;
                        const outer = this.size;
                        const inner = this.size * 0.4;
                        for (let i = 0; i < spikes; i++) {
                            ctx.lineTo(
                                Math.cos((i * 2 * Math.PI) / spikes - Math.PI / 2) * outer,
                                Math.sin((i * 2 * Math.PI) / spikes - Math.PI / 2) * outer
                            );
                            ctx.lineTo(
                                Math.cos(((i * 2 + 1) * Math.PI) / spikes - Math.PI / 2) * inner,
                                Math.sin(((i * 2 + 1) * Math.PI) / spikes - Math.PI / 2) * inner
                            );
                        }
                        ctx.closePath();
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }
            
            function spawnParticle() {
                if (particles.length < maxParticles) {
                    particles.push(new Particle());
                }
            }
            
            function animate() {
                // Black background inside the circle area
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);
                
                // Draw subtle circle border
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Update & draw particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw();
                }
                
                // Spawn new particles slowly
                if (Math.random() < 0.45) spawnParticle();
                
                requestAnimationFrame(animate);
            }
            
            // Initialize with particles
            for (let i = 0; i < maxParticles; i++) {
                particles.push(new Particle());
            }
            
            animate();
        }

        // Music + click handler
        function initMusicAndClick() {
            const music = document.getElementById('background-music');
            const introScreen = document.getElementById('intro-screen');
            
            introScreen.addEventListener('click', function () {
                introScreen.style.opacity = '0';
                setTimeout(() => {
                    introScreen.style.display = 'none';
                }, 600);
                
                // Start music after user interaction
                music.play().catch(err => {
                    console.log('Music autoplay prevented:', err);
                });
            });
            
            // Optional: if user refreshes, music won't play until click again
            console.log('%c✅ mybio.lat ready — click anywhere to start the music!', 'color:#fff; background:#000; padding:2px 6px; border-radius:4px;');
        }

        // Main initialization
        window.onload = function () {
            initTailwind();
            initPFPAnimation();
            initMusicAndClick();
        };
    </script>
</body>
</html>
