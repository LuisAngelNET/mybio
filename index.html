<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click para sonar</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            cursor: pointer;
        }
        #mensaje {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="mensaje">Haz clic en cualquier parte para reproducir</div>

    <!-- Audio invisible -->
    <audio id="miAudio" loop>
        <source src="https://github.com/user-attachments/assets/904c5549-ea33-493e-a168-53aa1f509c37" type="video/mp4">
    </audio>

    <script>
        const audio = document.getElementById('miAudio');
        const mensaje = document.getElementById('mensaje');

        document.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(e => console.log("Error al reproducir:", e));
                mensaje.style.opacity = "0"; // Oculta el mensaje después del primer clic
            }
        });

        // Opcional: también funciona con touch en móviles
        document.addEventListener('touchstart', () => {
            if (audio.paused) {
                audio.play();
                mensaje.style.opacity = "0";
            }
        }, { once: true });
    </script>

</body>
</html>
