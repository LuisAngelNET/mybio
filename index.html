<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mybio.lat</title>
<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000 url('https://i.pinimg.com/originals/12/eb/55/12eb5546de3d7124df0fb9362af2587c.gif') center/cover no-repeat;
    cursor: none;
    user-select: none;
}

#custom-cursor {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    opacity: 0.8;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
}

#overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.78);
    pointer-events: none;
    z-index: 5;
    transition: opacity 1.8s ease;
}

#click-mensaje {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 2.5rem;
    color: rgba(255, 255, 255, 0.9);
    text-align: center;
    z-index: 10;
    text-shadow: 0 0 20px #000;
    transition: opacity 1.5s ease;
}

#panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    width: 380px;
    max-width: 92vw;
    background: rgba(0, 0, 0, 0.93);
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    padding: 35px 25px 30px;
    text-align: center;
    z-index: 30;
    opacity: 0;
    transition: all 2s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: 0 0 70px rgba(0, 0, 0, 0.95);
    pointer-events: none;
}

#panel.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
}

#panel.expand {
    transform: translate(-50%, -50%) scale(1.08);
    padding: 45px 30px;
}

#pfp {
    width: 170px;
    height: 170px;
    background: #0a0a0a url('https://mgpgroup.xyz/members/owner.jpg') center/cover no-repeat;
    border: 6px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    margin: 0 auto 18px;
    box-shadow: 0 0 40px rgba(0,0,0,0.95);
}

#name {
    font-size: 2.4rem;
    color: #fff;
    margin: 10px 0 8px;
    text-shadow: 0 0 12px rgba(255,255,255,0.4);
}

#description {
    font-size: 1.45rem;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 20px;
}

#mgp-link {
    color: #00ccff;
    text-decoration: none;
    font-size: 1.35rem;
    padding: 10px 28px;
    border: 2px solid rgba(0, 204, 255, 0.4);
    border-radius: 50px;
    display: inline-block;
    margin: 10px 0;
    transition: all 0.4s ease;
}

#mgp-link:hover {
    background: rgba(0, 204, 255, 0.15);
    border-color: #00ccff;
    transform: scale(1.08);
}

#countdown-container {
    display: none;
    margin-top: 15px;
}

#countdown {
    font-size: 3.2rem;
    font-weight: bold;
    color: #fff;
    margin: 10px 0;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
}

#skip-btn {
    margin-top: 8px;
    padding: 12px 32px;
    font-size: 1.05rem;
    background: rgba(255,255,255,0.08);
    color: white;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
}

#skip-btn:hover {
    background: rgba(255,255,255,0.18);
    border-color: white;
}
</style>
</head>
<body>

<div id="custom-cursor"></div>
<div id="overlay"></div>

<div id="click-mensaje">Click anywhere to continue</div>

<div id="panel">
    <div id="pfp"></div>
    <div id="name">Luis_808</div>
    <div id="description">Python Developer</div>
    <a href="#" id="mgp-link">mgpgroup.xyz</a>
    
    <div id="countdown-container">
        <div id="countdown">5</div>
        <button id="skip-btn">Click here to skip the wait, or if you weren't redirected</button>
    </div>
</div>

<audio id="miAudio" loop>
    <source src="https://github.com/user-attachments/assets/904c5549-ea33-493e-a168-53aa1f509c37" type="video/mp4">
</audio>

<script>
const audio = document.getElementById('miAudio');
const clickMensaje = document.getElementById('click-mensaje');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const mgpLink = document.getElementById('mgp-link');
const countdownContainer = document.getElementById('countdown-container');
const countdownEl = document.getElementById('countdown');
const skipBtn = document.getElementById('skip-btn');
const cursor = document.getElementById('custom-cursor');

let timeLeft = 5;
let countdownActive = false;

// Cursor
document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

function onInitialClick() {
    if (audio.paused) {
        audio.play().catch(() => {});

        clickMensaje.style.opacity = "0";
        overlay.style.opacity = "0";

        setTimeout(() => panel.classList.add('show'), 300);
    }
}

// Click on mgpgroup.xyz button
mgpLink.addEventListener('click', (e) => {
    e.preventDefault();
    
    // Expand panel
    panel.classList.add('expand');
    
    // Hide initial link and show countdown
    mgpLink.style.display = 'none';
    countdownContainer.style.display = 'block';
    
    if (!countdownActive) {
        countdownActive = true;
        startCountdown();
    }
});

function startCountdown() {
    const timer = setInterval(() => {
        timeLeft--;
        countdownEl.textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timer);
            window.location.href = "https://mgpgroup.xyz";
        }
    }, 1000);
}

// Skip button
skipBtn.addEventListener('click', () => {
    window.location.href = "https://mgpgroup.xyz";
});

// Start
document.addEventListener('click', onInitialClick, { once: true });
document.addEventListener('touchstart', onInitialClick, { once: true });
</script>
</body>
</html>
